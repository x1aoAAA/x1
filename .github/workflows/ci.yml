name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and assets
        run: node test/manifest.mjs
      - name: Check plugin script syntax
        run: node --check plugins/deepseek-balance/scripts/deepseek_balance.mjs
